name: Build Mobile Tiny Task
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare project
        env:
          PROJECT_ZIP_0: ""
          PROJECT_ZIP_1: ""
          PROJECT_ZIP_2: ""
        run: |
          python - <<'PYTHON'
          import os, base64, zipfile, io
          zipfile.ZipFile(io.BytesIO(base64.b64decode(''.join(os.environ['PROJECT_ZIP_'+str(i)] for i in range(3))))).extractall('.')
          PYTHON
      - name: Build APK
        working-directory: MobileTinyTask
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MobileTinyTask-debug-apk
          path: MobileTinyTask/app/build/outputs/apk/debug/app-debug.apk
